- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: goal-round-driver
  disabled: true

- insert:
    - id: tianwen-model-runner
      name: '@tianwen/runtime-bundle/model-runner'
      config:
        operation: !!js process.env.TIANWEN_MODEL_OPERATION
        model: !!js process.env.TIANWEN_MODEL_MODEL || undefined
        json: !!js process.env.TIANWEN_MODEL_JSON === 'true'
