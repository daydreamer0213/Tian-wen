- id: session-persistence-jsonl
  config:
    root: !!js process.env.TIANWEN_RESUME_SESSIONS_ROOT
    compression: none
    packChunks: false

- id: tianwen-runtime
  config:
    evolutionRoot: !!js process.env.TIANWEN_RESUME_EVOLUTION_ROOT

- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- insert:
    - id: tianwen-resume-runner
      name: '@tianwen/runtime-bundle/resume-runner'
      config:
        goalId: !!js process.env.TIANWEN_RESUME_GOAL_ID
        sessionId: !!js process.env.TIANWEN_RESUME_SESSION_ID
        revision: !!js Number(process.env.TIANWEN_RESUME_REVISION)
        nonce: !!js process.env.TIANWEN_RESUME_NONCE
        json: !!js process.env.TIANWEN_RESUME_JSON === 'true'
