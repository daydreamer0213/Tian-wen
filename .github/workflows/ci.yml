name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run python -m compileall -q src tests
      - run: uv run pytest

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tianwen/runtime-bundle... build
      - run: pnpm run typecheck
      - run: pnpm run check:dsh-install
      - run: pnpm run check:no-private-dsh-imports
      - run: pnpm exec vitest run tests/dsh-probe/evidence.spec.ts tests/dsh-probe/research-preview-demo.spec.ts tests/dsh-probe/learning-intake.spec.ts tests/dsh-probe/learning-intake-runtime.spec.ts tests/dsh-probe/explicit-correction-demo.spec.ts tests/dsh-probe/outcome-intake.spec.ts tests/dsh-probe/outcome-intake-runtime.spec.ts tests/dsh-probe/repeated-outcome-demo.spec.ts tests/dsh-probe/skill-governance.spec.ts tests/dsh-probe/skill-governance-runtime.spec.ts tests/dsh-probe/governed-skill-candidate-demo.spec.ts tests/dsh-probe/skill-evaluation.spec.ts tests/dsh-probe/skill-evaluation-runtime.spec.ts tests/dsh-probe/paired-skill-evaluation-demo.spec.ts tests/dsh-probe/skill-shadow.spec.ts tests/dsh-probe/skill-shadow-eligibility-demo.spec.ts tests/dsh-probe/skill-promotion.spec.ts tests/dsh-probe/skill-promotion-readiness-demo.spec.ts tests/dsh-probe/natural-run-evidence-runtime.spec.ts tests/dsh-probe/natural-run-evidence-demo.spec.ts tests/dsh-migration/goal-status.spec.ts
      - run: pnpm exec vitest run tests/dsh-migration/learning-clue-status.spec.ts tests/dsh-migration/learn-loop-client.spec.ts tests/dsh-migration/learn-loop-client-module.spec.ts
      - run: pnpm exec vitest run tests/dsh-probe/research-summary.spec.ts tests/dsh-migration/runtime-composition.spec.ts tests/dsh-migration/message-feedback-bridge.spec.ts
      - name: Check ordinary learning, bounded exploration and admitted Skill reuse
        run: pnpm exec vitest run tests/dsh-probe/outcome-learning-analysis.spec.ts tests/dsh-probe/learning-analysis.spec.ts tests/dsh-probe/learning-exploration.spec.ts tests/dsh-migration/research-summary-admission.spec.ts tests/dsh-migration/learning-analysis-child.spec.ts tests/dsh-migration/learning-consent-agent.spec.ts tests/dsh-migration/learning-loop-orchestrator.spec.ts tests/dsh-migration/learning-loop-progress.spec.ts tests/dsh-migration/learning-loop-controlled-executor.integration.spec.ts tests/dsh-migration/native-feedback-profile.e2e.spec.ts tests/dsh-migration/learning-exploration.spec.ts tests/dsh-migration/learning-skill-reuse.spec.ts
        env:
          TIANWEN_DSH_PROBE_ROOT: ${{ runner.temp }}/tianwen-learning-fixtures
      - run: pnpm exec vitest run tests/dsh-probe/controlled-skill-evaluation.spec.ts tests/dsh-probe/controlled-skill-evaluation-runtime.spec.ts tests/dsh-probe/controlled-skill-shadow.spec.ts tests/dsh-probe/controlled-skill-shadow-runtime.spec.ts tests/dsh-probe/controlled-skill-activation.spec.ts tests/dsh-probe/controlled-skill-activation-runtime.spec.ts tests/dsh-probe/controlled-real-skill-lifecycle-runner.spec.ts tests/dsh-migration/controlled-lifecycle-profile.spec.ts tests/dsh-migration/explicit-correction-product.e2e.spec.ts
        env:
          TIANWEN_DSH_PROBE_ROOT: ${{ runner.temp }}/tianwen-v0.1-eval-fixtures
      - run: pnpm demo:research-preview
      - run: pnpm demo:explicit-correction
      - run: pnpm demo:repeated-outcome
      - run: pnpm demo:governed-skill-candidate
      - run: pnpm demo:paired-skill-evaluation
      - run: pnpm demo:shadow-eligibility
      - run: pnpm demo:promotion-readiness
      - run: pnpm demo:natural-run-evidence
  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tianwen/runtime-bundle... build
      - name: Run installer contract
        shell: pwsh
        run: |
          $mappedDrive = $false
          if (-not (Test-Path -LiteralPath 'D:\')) {
            & subst.exe D: $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'temporary D: mapping failed' }
            $mappedDrive = $true
          }
          $testExit = 0
          try {
            New-Item -ItemType Directory -Force -Path 'D:\DevData' | Out-Null
            node tests/dsh-migration/profile-concurrent-boot.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Profile concurrent cold-boot check failed' }
            pnpm exec vitest run tests/dsh-migration/tianwen-installer.spec.ts tests/dsh-migration/controlled-lifecycle-command.spec.ts tests/dsh-migration/runtime-bundle.spec.ts tests/dsh-migration/one-shot-profile-lifecycle.spec.ts tests/dsh-migration/learn-loop-host.spec.ts
            $testExit = $LASTEXITCODE
          } finally {
            if ($mappedDrive) { & subst.exe D: /D }
          }
          exit $testExit

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@tianwen/runtime-bundle...' build
      - run: pnpm --filter '@tianwen/runtime-bundle' pack --pack-destination "${{ runner.temp }}/tianwen-runtime-pack"
      - run: node scripts/stage-desktop-runtime.mjs "${{ runner.temp }}/tianwen-runtime-pack/tianwen-runtime-bundle-0.1.11.tgz"
      - run: pnpm --filter @tianwen/desktop-host build
      - name: Run deterministic Desktop tests
        shell: pwsh
        run: |
          $mappedDrive = $false
          if (-not (Test-Path -LiteralPath 'D:\')) {
            & subst.exe D: $env:RUNNER_TEMP
            if ($LASTEXITCODE -ne 0) { throw 'temporary D: mapping failed' }
            $mappedDrive = $true
          }
          $testExit = 0
          try {
            New-Item -ItemType Directory -Force -Path 'D:\DevData' | Out-Null
            pnpm exec vitest run tests/dsh-migration/tianwen-desktop-host.spec.ts tests/dsh-migration/tianwen-desktop-bootstrap.spec.ts tests/dsh-migration/tianwen-desktop-profile-prepare.spec.ts tests/dsh-migration/tianwen-desktop-artifact.spec.ts
            $testExit = $LASTEXITCODE
          } finally {
            if ($mappedDrive) { & subst.exe D: /D }
          }
          exit $testExit
      - run: pnpm --filter @tianwen/desktop-host pack:dir
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder
      - run: pnpm --filter @tianwen/desktop-host pack:win
        env:
          ELECTRON_CACHE: ${{ runner.temp }}\electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder
      - run: node scripts/audit-desktop-artifact.mjs dist/tianwen-desktop/win-unpacked "${{ runner.temp }}/tianwen-runtime-pack/tianwen-runtime-bundle-0.1.11.tgz"
      - name: Assert one Desktop installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath 'dist\tianwen-desktop' -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "expected exactly one Desktop installer, found $($installers.Count)"
          }
